<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | Hope English Language Center</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body>
    <div class="signup-container">
      <div class="signup-box">
        <h2>Admin Signup</h2>
        <p class="subtitle">Create an account to access  dashboard and manage content</p>

        <form>
          <div class="input-field">
            <label>Full name</label>
            <input type="text" placeholder="Enter name" required />
          </div>

          <div class="input-field">
            <label>Email Address</label>
            <input type="email" placeholder="admin@example.com" required />
          </div>

          <div class="input-field">
            <label>Password</label>
            <input type="password" placeholder="Enter password" required />
          </div>

          <button type="submit" class="btn-login">Signup</button>

          <p class="forgot-link">
            Already have an account?
            <a href="login.html">Login</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
