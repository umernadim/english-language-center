<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add-Quiz | Hope English Language Center</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
      <div class="st-form-container">
      <div class="st-box">
        <h2>Add New Quiz</h2>
        <p class="subtitle">
          Please provide your information of the quiz.
        </p>

        <form>

          <div class="input-field">
            <label>Title</label>
            <input type="text" placeholder="Test title" required />
          </div>

          <div class="input-field">
            <label>Description</label>
            <textarea rows="3" placeholder="Write a short description.."></textarea>
        </div>

        <div class="btns">
            <button type="" class="cancel-btn btn">Cancel</button>
            <button type="submit" class="save-btn btn">Save</button>
        </div>

        </form>
      </div>
    </div>
</body>
</html>
