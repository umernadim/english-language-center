<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #f4f6f8;
}

.admin-container {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 220px;
  background-color: #2e2e2e;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 20px;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar li {
  margin: 15px 0;
  cursor: pointer;
}

.sidebar li i {
  margin-right: 10px;
}

.main-content {
  flex: 1;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logout-btn {
  background-color: #007bff;
  color: white;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 4px;
}

#dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background-color: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  font-size: 1rem;
}
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <h2>Admin Panel</h2>
      <ul>
        <li><i class="fas fa-chalkboard-teacher"></i> Teachers</li>
        <li><i class="fas fa-blog"></i> Blogs</li>
        <li><i class="fas fa-question-circle"></i> Quizzes</li>
        <li><i class="fas fa-comments"></i> Feedback</li>
        <li><i class="fas fa-comment-dots"></i> Blog Comments</li>
      </ul>
    </aside>

    <main class="main-content">
      <header>
        <h1>Welcome, Admin</h1>
        <button class="logout-btn">Logout</button>
      </header>

      <section id="dashboard">
        <div class="card">Total Teachers: <span>12</span></div>
        <div class="card">Total Blogs: <span>34</span></div>
        <div class="card">Total Quizzes: <span>20</span></div>
        <div class="card">Feedbacks: <span>15</span></div>
        <div class="card">Pending Comments: <span>5</span></div>
      </section>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
