<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify-account | Hope English Language Center</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body>
    <div class="signup-container">
      <div class="signup-box">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter verification code to reset your password</p>

        <form>
          <div class="input-field">
            <label>Email Verification Code</label>
            <input type="text" placeholder="# # # #" required />
          </div>
          <button type="submit" class="btn-login">Verify</button>

          <p class="forgot-link">
            <a href="forgot-password.html"><i class="ri-arrow-left-line"></i>Go Back</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
