<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New-password | Hope English Language Center</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body>
    <div class="signup-container">
      <div class="signup-box">
        <h2>New Password</h2>
        <p class="subtitle">Enter new password to reset your account.</p>

        <form>
          <div class="input-field">
            <label>Email New Password</label>
            <input type="email" placeholder="admin@example.com" required />
          </div>
          <button type="submit" class="btn-login">Reset Password</button>

          <p class="forgot-link">
            <a href="login.html">Login with password</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
