<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Hope English Language Center</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <h2>Admin Login</h2>
        <p class="subtitle">Access your dashboard and manage content</p>

        <form>
          <div class="input-field">
            <label>Email Address</label>
            <input type="email" placeholder="admin@example.com" required />
          </div>

          <div class="input-field">
            <label>Password</label>
            <input type="password" placeholder="Enter password" required />
          </div>

          <button type="submit" class="btn-login">Login</button>

          <p class="forgot-link">
            Don't have an account?
            <a href="signup.html">Signup</a>
          </p>
          <p class="forgot-link">
            <a href="forgot-password.html" class="">Forgot Password?</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
